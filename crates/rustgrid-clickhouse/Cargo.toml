[package]
name = "rustgrid-clickhouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rustgrid-core.workspace = true
rustgrid-tunnel.workspace = true
async-trait.workspace = true
clickhouse.workspace = true
serde_json.workspace = true
# The official client builds its default HTTP transport with hyper 1. The driver supplies a custom
# one so the connection's TLS page (CA, client certificate/key, verification mode) is honoured.
hyper-util.workspace = true
hyper-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
