[package]
name = "rustgrid-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "RustGrid"
path = "src/main.rs"

[dependencies]
rustgrid-core.workspace = true
rustgrid-backup.workspace = true
rustgrid-export.workspace = true
rustgrid-import.workspace = true
rustgrid-mysql.workspace = true
rustgrid-sqlite.workspace = true
rustgrid-config.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
lsp-types.workspace = true
ropey.workspace = true
anyhow.workspace = true
rust-i18n.workspace = true
sqlparser.workspace = true
sqlformat.workspace = true
chrono.workspace = true
dtparse.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd.workspace = true
directories.workspace = true
sys-locale.workspace = true

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows.workspace = true

[dev-dependencies]
# UI tests render the SQL editor in a real (headless) gpui-kit window.
gpui-kit = { workspace = true, features = ["test-support"] }
