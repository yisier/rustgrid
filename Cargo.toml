[workspace]
resolver = "3"
members = [
    "crates/rustgrid-core",
    "crates/rustgrid-backup",
    "crates/rustgrid-export",
    "crates/rustgrid-import",
    "crates/rustgrid-mysql",
    "crates/rustgrid-config",
    "crates/rustgrid-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/yisier/rustgrid"
authors = ["yisier"]

[workspace.dependencies]
rustgrid-core = { path = "crates/rustgrid-core" }
rustgrid-backup = { path = "crates/rustgrid-backup" }
rustgrid-export = { path = "crates/rustgrid-export" }
rustgrid-import = { path = "crates/rustgrid-import" }
rustgrid-mysql = { path = "crates/rustgrid-mysql" }
rustgrid-config = { path = "crates/rustgrid-config" }

async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring", "chrono"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-i18n = "4"
directories = "6"
sys-locale = "0.3"
gpui = { package = "gpui-pre", version = "0.3" }
gpui-kit = "0.6"
sqlparser = "0.62"
sqlformat = "0.5"
rust_xlsxwriter = { version = "0.99", default-features = false }
calamine = { version = "0.36", default-features = false, features = ["dates"] }
encoding_rs = "0.8"
dtparse = "2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
chacha20poly1305 = "0.11"
base64 = "0.22"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
sha1 = "0.10"
zstd = "0.13"
raw-window-handle = "0.6"
embed-resource = "3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
