[workspace]
resolver = "3"
members = [
    "crates/rustgrid-core",
    "crates/rustgrid-backup",
    "crates/rustgrid-export",
    "crates/rustgrid-import",
    "crates/rustgrid-mysql",
    "crates/rustgrid-sqlite",
    "crates/rustgrid-sqlserver",
    "crates/rustgrid-postgresql",
    "crates/rustgrid-oracle",
    "crates/rustgrid-tunnel",
    "crates/rustgrid-odbc",
    "crates/rustgrid-config",
    "crates/rustgrid-app",
]
# A patched third-party crate (see `[patch.crates-io]`), not a workspace member.
exclude = ["vendor/sqlx-mysql"]

[workspace.package]
version = "0.0.13"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/yisier/rustgrid"
authors = ["yisier"]

[workspace.dependencies]
rustgrid-core = { path = "crates/rustgrid-core" }
rustgrid-backup = { path = "crates/rustgrid-backup" }
rustgrid-export = { path = "crates/rustgrid-export" }
rustgrid-import = { path = "crates/rustgrid-import" }
rustgrid-mysql = { path = "crates/rustgrid-mysql" }
rustgrid-sqlite = { path = "crates/rustgrid-sqlite" }
rustgrid-sqlserver = { path = "crates/rustgrid-sqlserver" }
rustgrid-postgresql = { path = "crates/rustgrid-postgresql" }
rustgrid-oracle = { path = "crates/rustgrid-oracle" }
rustgrid-tunnel = { path = "crates/rustgrid-tunnel" }
rustgrid-odbc = { path = "crates/rustgrid-odbc" }
rustgrid-config = { path = "crates/rustgrid-config" }

async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring", "chrono"] }
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono"] }
# Oracle's official pure-Rust thin driver (no OCI / Instant Client). Locked to an exact version
# because it is a pre-release whose API is still changing.
oracledb = { version = "=26.0.0-beta.4", default-features = false }
libloading = "0.8"
bb8 = { version = "0.9", default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-i18n = "4"
directories = "6"
sys-locale = "0.3"
# UI engine. `gpui` aliases the engine the ~40 view files import as `use gpui::…`. Enabling
# gpui-kit's `gpui-fast` feature makes the kit re-export `gpui-fast`, so this alias must point at
# gpui-fast too (a mismatched pair is two GPUI cores with incompatible element types). Note that
# gpui-kit still depends on gpui-pre unconditionally, so both engines are compiled; the alternative
# is the upstream backend: `gpui = { package = "gpui-pre", version = "0.3.7" }` with
# `gpui-kit = { version = "0.7", features = ["tree-sitter-sql"] }`.
gpui = { package = "gpui-fast", version = "0.1.7" }
gpui-kit = { version = "0.7", features = ["tree-sitter-sql", "gpui-fast"] }
# macOS-only: the Dock icon (`rustgrid-app/src/dock_icon.rs`). Every version below is already in the
# lock file through `gpui-fast-macos`, so this adds no new crates to the tree — which is why the
# features are listed here rather than at the (single) use site.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
lsp-types = "0.97"
ropey = "=2.0.0-beta.1"
sqlparser = "0.62"
sqlformat = "0.5"
rust_xlsxwriter = { version = "0.99", default-features = false }
calamine = { version = "0.36", default-features = false, features = ["dates"] }
encoding_rs = "0.8"
dtparse = "2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Connection import/export. RustGrid's own `.rgc` and DBX's plain export are JSON (serde_json);
# Navicat's `.ncx` is XML with the password stored as AES-128-CBC (the same scheme DBX reads).
# `aes`/`cbc`/`hex`/`quick-xml` were already in the lock file as transitive dependencies, so this
# adds no new crates to the tree.
quick-xml = "0.41"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
# Navicat 11 `.ncx` passwords use Blowfish; Navicat 12+ use AES-128-CBC (above).
blowfish = "0.10"
hex = "0.4"
# GitHub-Releases self-update: detection, download of the portable archive for the running target,
# in-place replacement and relaunch. Uses ureq (blocking, rustls) instead of the default reqwest
# client to keep the dependency tree small.
self_update = { version = "1.3", default-features = false, features = [
    "github",
    "ureq",
    "rustls",
    "native-certs",
    "archive-zip",
    "compression-zip-deflate",
    "archive-tar",
    "compression-tar-gz",
] }
chacha20poly1305 = "0.11"
base64 = "0.22"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
sha1 = "0.10"
zstd = "0.13"
raw-window-handle = "0.6"
embed-resource = "3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# sqlx-mysql 0.9.0 with the fixes in `vendor/sqlx-mysql/RUSTGRID_PATCHES.md`, so MySQL servers
# older than 5.5 accept the login. Drop this once an upstream sqlx release carries them.
[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
