name: UPX probe

# Temporary: finds a download path for the UPX 5.3.0 release binaries that GitHub's release CDN
# answers without a 504. Delete once release.yml no longer needs it.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Direct github.com
        run: |
          curl -sS -o /dev/null -w "direct=%{http_code} t=%{time_total}\n" --max-time 90 \
            "https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-amd64_linux.tar.xz" || echo "direct failed $?"

      - name: Asset API
        run: |
          id=$(curl -sS https://api.github.com/repos/upx/upx/releases/tags/v5.3.0 \
            | jq -r '.assets[] | select(.name == "upx-5.3.0-amd64_linux.tar.xz") | .id')
          echo "asset id=$id"
          curl -sSL -H "Accept: application/octet-stream" -o /dev/null \
            -w "api=%{http_code} size=%{size_download} t=%{time_total}\n" --max-time 90 \
            "https://api.github.com/repos/upx/upx/releases/assets/$id" || echo "api failed $?"

      - name: gh release download
        run: |
          gh release download v5.3.0 --repo upx/upx --pattern "upx-5.3.0-amd64_linux.tar.xz" --dir /tmp/ghx || echo "gh failed $?"
          ls -l /tmp/ghx 2>/dev/null || true

      - name: apt version
        run: apt-cache policy upx-ucl | head -6

      - name: Retry loop (10 x 3s)
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 40 \
              "https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-amd64_linux.tar.xz" || echo curl-fail)
            echo "try $i -> $code"
            [ "$code" = "200" ] && break
            sleep 3
          done
