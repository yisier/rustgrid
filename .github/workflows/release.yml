# Build and publish the portable RustGrid release archives when a `v*` tag is pushed.
#
# Produces six assets, one per platform/arch (the names MUST contain the `platform` tag the app
# looks for in `crates/rustgrid-app/src/app/update.rs`):
#
#   RustGrid-<version>-windows-x64.zip
#   RustGrid-<version>-windows-arm64.zip
#   RustGrid-<version>-macos-arm64.tar.gz
#   RustGrid-<version>-macos-x64.tar.gz
#   RustGrid-<version>-linux-x64.tar.gz
#   RustGrid-<version>-linux-arm64.tar.gz
#
# Both macOS archives are built on the arm64 runner (macOS 15); `macos-x64` cross-compiles
# `x86_64-apple-darwin` there because GitHub retired its Intel `macos-13` image, and the successor
# `macos-15-intel` is itself scheduled to disappear after August 2027. `MACOSX_DEPLOYMENT_TARGET`
# pins the minimum OS to macOS 12 (Monterey) — without it cc-rs stamps every C dependency with the
# runner's SDK version, which would raise the whole binary's floor.
#
# Each archive holds the app at its root: `RustGrid.exe` on Windows, `RustGrid` on Linux, and
# `RustGrid.app` (an app bundle: `Contents/MacOS/RustGrid` plus the Info.plist and `AppIcon.icns`
# from `packaging/macos/`) on macOS — a raw Mach-O has no `CFBundleIconFile`, so Finder and the Dock
# would only ever draw the generic executable icon. The in-app updater mirrors this split: on macOS
# it swaps the whole bundle when it runs from one, and extracts the inner executable otherwise (see
# `crates/rustgrid-app/src/app/update.rs`).
#
# The macOS bundle is ad-hoc signed only (no Developer ID, no notarization), so Gatekeeper still
# shows "unidentified developer" on first launch of a quarantined download; users dismiss it with
# right-click -> Open or `xattr -dr com.apple.quarantine RustGrid.app`. A quarantined bundle also
# runs translocated (from a read-only randomized mount), where self_update refuses to swap it and
# reports that the app must be moved first — that is the crate's `Error::AppTranslocated`.
#
# Linux and Windows executables are UPX-compressed with `--best --lzma`. UPX 5.3 supports
# linux/amd64, linux/arm64 and win64/pe (x64 and arm64). macOS is deliberately left as built:
# UPX refuses Mach-O without `--force-macos`, and its author states that forced-packed binaries
# do not run on macOS 13+ (this app targets macOS 12+, but most users are on newer releases).
# Linux keeps the packed ELF inside the portable tarball; unpack it with `upx -d RustGrid` if a
# security scanner objects. The tag's version must equal the workspace `Cargo.toml` version,
# otherwise the release job fails — the app reports its own `CARGO_PKG_VERSION` to the updater,
# so a mismatch would make it miss or mis-install updates.
name: Release

on:
  push:
    tags:
      - "v*"
  # Allow a manual run from the Actions tab (builds the archives without publishing a release).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  UPX_VERSION: "5.3.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          # Cross-compiled from the same arm64 runner; see the header note. The x86_64 std is
          # installed by the `Install Rust` step below.
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # macOS binaries must run on macOS 12 (Monterey) and later. Both arches use the same floor;
      # see the header note. Set before any compilation so `cc` and rustc both honour it.
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # GPUI on Linux needs X11/Wayland/xkbcommon/fontconfig development headers at build time.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype6-dev \
            libxcursor-dev \
            pkg-config

      # Release builds compile GPUI's HLSL shaders, which needs `fxc.exe` from the Windows SDK.
      # Point the build script at it explicitly (the Windows SDK is installed on the runner).
      # `fxc.exe` must match the runner's architecture: an arm64 fxc cannot run on an x64 runner
      # (and vice versa). Prefer the host-arch build, then fall back to any.
      - name: Locate fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin"
          )
          $candidates = foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Filter fxc.exe -Recurse -ErrorAction SilentlyContinue
            }
          }
          $fxc = $candidates | Where-Object { $_.FullName -match "\\$arch\\fxc\.exe$" } | Select-Object -First 1
          if (-not $fxc) { $fxc = $candidates | Select-Object -First 1 }
          if (-not $fxc) { throw "fxc.exe was not found in the Windows SDK" }
          Write-Host "Using fxc ($arch): $($fxc.FullName)"
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Panic locations embed the absolute registry/workspace paths. Rewriting them to short
      # prefixes trims the `.rodata` string table (the Linux binary carries ~200 KB of registry
      # paths) and makes archives build reproducibly across runner home directories. The registry
      # hash is the stable sparse-index hash for crates.io.
      - name: Configure path remapping
        if: runner.os != 'Windows'
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f=/cargo --remap-path-prefix=${GITHUB_WORKSPACE}=/rustgrid" >> "$GITHUB_ENV"

      - name: Configure path remapping (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $registry = Join-Path $env:USERPROFILE '.cargo\registry\src\index.crates.io-1949cf8c6b5b557f'
          "RUSTFLAGS=--remap-path-prefix=$registry=/cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=/rustgrid" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p rustgrid-app

      # UPX 5.3 compresses every Linux and Windows executable. Windows covers win64/pe for both
      # x64 and arm64; the win64 packer runs on the arm64 runner through Windows' x64 emulation.
      - name: Compress with UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx-tool
          $upx = (Get-ChildItem upx-tool -Recurse -Filter upx.exe | Select-Object -First 1).FullName
          & $upx --best --lzma "target/${{ matrix.target }}/release/RustGrid.exe"
          if ($LASTEXITCODE -ne 0) { throw "UPX compression failed with exit code $LASTEXITCODE" }
          & $upx -t "target/${{ matrix.target }}/release/RustGrid.exe"
          if ($LASTEXITCODE -ne 0) { throw "UPX self-test failed with exit code $LASTEXITCODE" }

      # The packer binary must match the runner, not the target: an x64 UPX runs on the x64
      # runner, an arm64 UPX on the arm64 one, and either can pack the target ELF.
      - name: Compress with UPX (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          case "${{ runner.arch }}" in
            X64) upx_arch=amd64 ;;
            ARM64) upx_arch=arm64 ;;
            *) echo "::error::unsupported runner architecture: ${{ runner.arch }}"; exit 1 ;;
          esac
          url="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-${upx_arch}_linux.tar.xz"
          curl -fsSL -o upx.tar.xz "$url"
          tar -xf upx.tar.xz
          upx="$(find . -maxdepth 2 -type f -name upx | head -n 1)"
          test -n "$upx"
          chmod +x "$upx"
          "$upx" --best --lzma "target/${{ matrix.target }}/release/RustGrid"
          "$upx" -t "target/${{ matrix.target }}/release/RustGrid"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $name = "RustGrid-$ver-${{ matrix.platform }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/RustGrid.exe" -DestinationPath $name

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          name="RustGrid-${ver}-${{ matrix.platform }}.tar.gz"
          app="dist/RustGrid.app"
          rm -rf dist
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/RustGrid" "$app/Contents/MacOS/RustGrid"
          sed "s/@VERSION@/${ver}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          sh packaging/macos/make-icns.sh crates/rustgrid-app/assets/logo.png \
            "$app/Contents/Resources/AppIcon.icns"
          # Fail on a malformed property list or a missing icon rather than shipping a bundle
          # macOS cannot read its name/icon/version from.
          plutil -lint "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/AppIcon.icns"
          # Ad-hoc signing keeps the bundle's seal consistent after Contents/ was assembled (arm64
          # binaries must carry a signature to launch at all). No Developer ID exists, so this does
          # not satisfy Gatekeeper — see the header note. Verify the seal here, so a signing
          # problem fails the job instead of shipping a bundle macOS refuses to launch.
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          tar -czf "$name" -C dist RustGrid.app
          ls -lh "$name"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="RustGrid-${ver}-${{ matrix.platform }}.tar.gz"
          tar -czf "$name" -C "target/${{ matrix.target }}/release" RustGrid
          ls -lh "$name"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: RustGrid-${{ matrix.platform }}
          path: RustGrid-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Only publish for version tags; a manual run just produces the downloadable artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail early when the tag and the workspace version disagree (they feed the updater).
      - name: Check version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag cargo=$cargo_version"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $cargo_version"
            exit 1
          fi

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release body only links to the per-language changelogs: the app reads the notes from the
      # file matching the UI language (see `crates/rustgrid-app/src/app/changelog.rs`), so adding a
      # language never grows the body. The English and Chinese files must still document this
      # version — English is every language's fallback, and the repository's rule is that both carry
      # every version. Any other CHANGELOG_*.md is linked as it appears.
      - name: Build the release notes from the changelog links
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v want="## [$version]" '
              index($0, want) == 1 { inside = 1 }
              inside && /^## \[/ && index($0, want) != 1 { exit }
              inside { print }
            ' "$1"
          }
          for file in CHANGELOG.md CHANGELOG_zh.md; do
            if [ -z "$(section "$file")" ]; then
              echo "::error::$file has no section for $version — add it before tagging"
              exit 1
            fi
          done
          declare -A labels=(
            ["CHANGELOG.md"]="English"
            ["CHANGELOG_zh.md"]="简体中文"
            ["CHANGELOG_ru.md"]="Русский"
          )
          {
            echo "<!-- rustgrid:changelog -->"
            echo "### Changelog"
            echo
            for file in CHANGELOG.md CHANGELOG_*.md; do
              [ -f "$file" ] || continue
              label="${labels[$file]:-${file#CHANGELOG_}}"
              label="${label%.md}"
              echo "- [$label](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${file})"
            done
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
          prerelease: false
