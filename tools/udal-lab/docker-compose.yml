name: rustgrid-udal-lab

services:
  udal-mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: Root123!
      MARIADB_DATABASE: UDAL_TEST
      MARIADB_USER: udal
      MARIADB_PASSWORD: udal123
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  udal-zk:
    image: zookeeper:3.9
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  udal-dbproxy:
    build:
      context: .
      args:
        UDAL_ALLOW_DDL: ${UDAL_ALLOW_DDL:-0}
    depends_on:
      udal-mariadb:
        condition: service_healthy
      udal-zk:
        condition: service_healthy
    ports:
      - "8066:8066"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8066'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped
